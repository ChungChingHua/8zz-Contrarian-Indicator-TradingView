name: Continue history using repaired and cached media 20261111
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  resume:
    if: ${{ false }} # Saved cache and quota-blocked progress; one-time entry closed.
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      AUTHORIZED_HISTORY_SCOPE: history-completion-20261107
      AUTHORIZED_RESUME_ID: 20261111-media-repair-01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline regression before any generation
        run: python -m unittest discover -s scripts -p 'test*.py'
      - name: Restore hash-verified cache from successful three-post repair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: media-repair-20261111-01-cache
          run-id: 43020412869
          github-token: ${{ github.token }}
          path: /tmp/8zz-history-media-cache
      - name: Continue unsent posts; fresh exact-URL media batches under existing caps
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CHATANYWHERE_API_KEY: ${{ secrets.CHATANYWHERE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_cached_completion.py
      - name: Preserve verified cache without signed URL queries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-media-cache-20261111-continuation
          path: /tmp/8zz-history-media-cache/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish complete outputs and September-limited strategy without generation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/history_completion.py publish-report
          PYTHONPATH=scripts python - <<'PY'
          import os
          from pathlib import Path
          from build_pine_strategy import build
          from history_completion import Remote,publish_text
          build()
          remote=Remote(os.environ.pop('GH_TOKEN'))
          for path in ('candidates/8zz-strategy-latest.pine','candidates/8zz-strategy-latest.checks.json'):
              publish_text(remote,path,Path(path).read_text())
          PY
      - name: Final offline checks
        if: always()
        run: python -m unittest discover -s scripts -p 'test*.py'
