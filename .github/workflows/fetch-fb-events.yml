name: Social update (bounded)
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: ['.github/workflows/fetch-fb-events.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [smoke, update, classify-only]
        default: smoke
      max_posts:
        description: Posts per platform (1..50)
        default: '5'
      ai_limit:
        description: Maximum AI attempts (0..50)
        default: '2'
  # Schedule intentionally disabled pending OpenAI smoke and cost review.
permissions:
  contents: write
concurrency:
  group: social-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Missing OpenAI key stops before any paid acquisition or classification.
      - name: Offline regression tests
        run: python -m unittest discover -s scripts -p 'test*.py' -v
      - name: Check schedule gate
        id: gate
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'smoke' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/social_validation.json')
          v=json.loads(p.read_text()) if p.exists() else {}
          valid=v.get('passed') is True and v.get('provider')=='openai' and v.get('model')==os.environ['OPENAI_MODEL']
          active=os.environ['EVENT']!='schedule' or valid
          if os.environ['MODE']!='smoke' and os.environ['EVENT']!='schedule' and not valid:
              raise SystemExit('Run smoke successfully before paid updates')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('active='+str(active).lower()+'\n')
          PY
      - name: Inspect smoke image metadata without secrets or paid API calls
        run: |
          python - <<'PY'
          import sys, json, urllib.parse, urllib.request
          sys.path.insert(0,'scripts')
          from social_pipeline import read, ROOT
          a=read(ROOT/'data/social_posts.json',{})
          for source in ('facebook','threads'):
              p=max((p for p in a.values() if p['source']==source and p['attachments']),key=lambda p:p['unix_ms'])
              for m in p['attachments']:
                  url=m.get('photo_image',{}).get('uri') or m.get('url')
                  print(source,'media_keys',list(m),'type',m.get('type') or m.get('__typename'),'host',urllib.parse.urlparse(url or '').hostname)
                  try:
                      with urllib.request.urlopen(url,timeout=30) as res:
                          print('download',res.status,res.headers.get_content_type(),len(res.read(8000001)))
                  except Exception as e:
                      print('image_error',type(e).__name__,'reason_type',type(getattr(e,'reason',None)).__name__,'errno',getattr(getattr(e,'reason',None),'errno',None))
          PY
      - name: Bounded acquisition and multimodal classification
        if: steps.gate.outputs.active == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          MONTHLY_AI_LIMIT: ${{ vars.MONTHLY_AI_LIMIT || '400' }}
          MODE: ${{ github.event_name == 'schedule' && 'update' || inputs.mode || 'smoke' }}
          POST_LIMIT: ${{ inputs.max_posts || '5' }}
          AI_LIMIT: ${{ github.event_name == 'schedule' && '10' || inputs.ai_limit || '2' }}
        run: python scripts/run_social_update.py
      - name: Rebuild cached performance (no market API costs)
        if: always() && steps.gate.outputs.active == 'true'
        run: python scripts/social_pipeline.py && python scripts/build_site_data.py --offline
      - name: Persist checkpoints even on provider failure
        if: always() && steps.gate.outputs.active == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social*.json data/acquisition.json data/usage.json 8zz-indicator.pine docs/events.json docs/social-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist social archive and processing checkpoints'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-update
          path: |
            8zz-indicator.pine
            data/social*.json
            data/acquisition.json
            data/usage.json
          retention-days: 14
