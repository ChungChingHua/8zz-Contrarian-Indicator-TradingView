name: Repair three archived media sources 20261111
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/history-media-repair-20261111.yml]
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline checks before paid bounded refresh
        run: |
          python -m py_compile scripts/history_media_refresh_probe.py
          python -m unittest discover -s scripts -p 'test*.py'
      - name: Refresh only three exact post URLs; two Actor starts maximum; no AI
        env:
          AUTHORIZED_MEDIA_REPAIR: media-repair-20261111-01
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_media_refresh_probe.py
      - name: Preserve verified image cache, no signed URL queries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media-repair-20261111-01-cache
          path: /tmp/8zz-history-media-cache/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signed URLs
        if: always()
        run: rm -f /tmp/8zz-media-refreshed-facebook.json /tmp/8zz-media-refreshed-threads.json
