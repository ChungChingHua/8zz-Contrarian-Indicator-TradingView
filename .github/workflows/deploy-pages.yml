name: Deploy GitHub Pages

on:
  # Run after the data-update workflow finishes
  workflow_run:
    workflows: ["Social update (bounded)"]
    types:
      - completed

  # Also deploy on any direct push to main (ensures first-time deploy works)
  push:
    branches:
      - main

  # Redeploy on a daily schedule so the site stays up even without doc changes
  schedule:
    - cron: "0 6 * * *"

  # Allow manual trigger
  workflow_dispatch:

# Grant the minimum permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Only allow one deployment at a time; cancel in-progress ones
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # Paused during security review; prevents inherited Pages schedules from publishing.
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only deploy if the upstream workflow succeeded
    if: ${{ false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Pages assets exist
        run: |
          test -f docs/index.html
          test -f docs/events.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

