name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/public_dashboard.py', 'scripts/pages_changed.py', '.github/workflows/deploy-pages.yml']
  workflow_run:
    workflows: ['Live incremental update (disabled by default)', 'One-time history completion', 'Resume authorized history 20261108', 'Resume authorized history 20261109', 'Resume authorized history 20261110']
    types: [completed]
    branches: [main, codex/social-pipeline-20261106]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    # Explicit opt-in remains unset. No deployment during PR development.
    if: ${{ vars.PAGES_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Package only approved public assets and compare last successful deployment
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          digest=$(python scripts/public_dashboard.py docs /tmp/pages-public)
          changed=$(python scripts/pages_changed.py "$REPOSITORY" "$digest")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "$digest" > /tmp/pages-public-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.compare.outputs.changed == 'true'
        with:
          name: pending-pages-digest
          path: /tmp/pages-public-digest.txt
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.compare.outputs.changed == 'true'
        with:
          path: /tmp/pages-public
  deploy:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pending-pages-digest
          path: /tmp/pages-marker
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record digest only after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/pages_changed.py record "$REPOSITORY" "$(cat /tmp/pages-marker/pages-public-digest.txt)"
