name: Original-author history batch (manual)
on:
  workflow_dispatch:
    inputs:
      resume_unsent_media_failure:
        description: 'Only proven zero-generation media failure; never provider/unknown retry'
        type: boolean
        default: false
      reconcile_saved_image_note:
        description: 'Offline saved HTTP200 unread-image-note correction only; no resend'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  batch:
    if: github.ref == 'refs/heads/codex/social-pipeline-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline verification before credentials
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: One authorized batch with remote checkpoints
        env:
          CHATANYWHERE_API_KEY: ${{ secrets.CHATANYWHERE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RESUME_UNSENT_MEDIA_FAILURE: ${{ inputs.resume_unsent_media_failure && '1' || '0' }}
          RECONCILE_SAVED_IMAGE_NOTE: ${{ inputs.reconcile_saved_image_note && '1' || '0' }}
          AUTHORIZED_HISTORY_BATCH: original-author-20261107-01
          AUTHORIZED_RULE_SHA256: 8ccd8bbe6388705261e7240897417683f2dc6e2016f5db9d5eca462533837162
          AUTHORIZED_PLAN_SHA256: 09d64472eb22998b9ff5478f67b218d5d8530b7f236fc9fdf46a48f4d3bb09e0
        run: python scripts/history_worker.py
      - name: Candidate from last acknowledged checkpoints only
        if: always()
        run: |
          if test -f data/history_progress/original-author-20261107-01.json; then
            python scripts/original_candidate.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-author-batch-01
          path: |
            data/history_progress/original-author-20261107-01*.json
            candidates/8zz-original-author-batch-01*
          retention-days: 14
          if-no-files-found: ignore
