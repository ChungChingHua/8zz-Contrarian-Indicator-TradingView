name: Public media root-cause diagnosis 20261111
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/history-media-rootcause-20261111.yml]
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile bounded diagnostic
        run: python -m py_compile scripts/diagnose_history_media.py
      - name: At most six unauthenticated public-CDN GETs; no AI or Apify credentials
        env:
          AUTHORIZED_MEDIA_DIAGNOSTIC: 20261111-rootcause
          GH_TOKEN: ${{ github.token }}
        run: python scripts/diagnose_history_media.py
