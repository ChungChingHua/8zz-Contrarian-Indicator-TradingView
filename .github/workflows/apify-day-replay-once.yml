name: One-time 2026-11-10 trading-day acquisition cost replay
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  replay:
    if: ${{ false }} # Authorized day replay completed; online entry disabled.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline replay guards
        run: python -m unittest discover -s scripts -p 'test_apify*.py'
      - name: Authorized historical replay only; no AI or notifications
        env:
          AUTHORIZED_DAY_REPLAY: apify-day-replay-20261110-01
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/apify_day_replay.py
      - name: Isolated cost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apify-day-replay-20261110-01
          path: cost-test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
