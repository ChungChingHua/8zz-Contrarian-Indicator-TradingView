name: One-time isolated Apify 15 minute cost test
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/apify-cost-15m-once.yml]
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  cost-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline tests before authorized acquisition
        run: python -m unittest discover -s scripts -p test_apify_cost_test.py
      - name: One cost experiment; no AI or notifications
        env:
          AUTHORIZED_APIFY_COST_TEST: apify-15m-20261110-01
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/apify_cost_test.py
