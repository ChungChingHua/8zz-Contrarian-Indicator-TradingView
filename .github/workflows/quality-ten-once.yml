name: Authorized remaining blind quality samples
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/quality-ten-once.yml]
permissions:
  contents: write
concurrency:
  group: independent-quality-ten-20261107
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline tests before any provider request
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Only previously unattempted rows 6..10, no retry
        env:
          CHATANYWHERE_API_KEY: ${{ secrets.CHATANYWHERE_API_KEY }}
          AUTHORIZED_QUALITY_SCOPE: 2026-11-07-independent-quality-unattempted-only-v1
          AUTHORIZED_PROTOCOL_SHA256: a1fa9e748994ac713a05bf0633f3b152bca0a86c325e268534456046faab5846
          AUTHORIZED_PLAN_SHA256: c300306ddaaad7c6cf6c5008042e2d34cf8f7f62e944d948777e5cfa8d6493de
        run: python scripts/continue_quality_test.py
      - name: Persist sanitized test evidence without AI key
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/persist_quality_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-test-sanitized-evidence
          path: data/quality_test_results.json
          retention-days: 7
          if-no-files-found: ignore
