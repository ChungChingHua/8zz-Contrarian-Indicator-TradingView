name: Finalize repaired history outputs offline
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/history-repair-finalize-20261111.yml]
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  finalize:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline projection only; no provider Secrets or external reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os
          from pathlib import Path
          from unittest.mock import patch
          import history_completion as hc
          import build_audited_dashboard as dashboard
          from build_pine_strategy import build
          token=os.environ.pop('GH_TOKEN')
          with patch('urllib.request.urlopen',side_effect=AssertionError('offline_only')), patch('urllib.request.OpenerDirector.open',side_effect=AssertionError('offline_only')):
              summary=hc.report()
              dashboard.build(refresh_market=False)
              build()
          doc=Path('docs/HISTORY_COMPLETION.md')
          doc.write_text(doc.read_text()+'\n本次媒體修復與續跑詳見 [修復執行紀錄](HISTORY_MEDIA_REPAIR_20261111.md)；API已因429停止，一次性入口已停用。\n')
          remote=hc.Remote(token)
          for path in ('data/history_completion_inventory.json','data/history_completion_summary.json','data/signal_events.json'):
              remote.save(path,json.loads(Path(path).read_text()))
          version=json.loads(Path('docs/data-version.json').read_text())['version']
          for path in ('candidates/8zz-history-latest.pine','candidates/8zz-history-latest.checks.json','docs/HISTORY_COMPLETION.md','candidates/8zz-strategy-latest.pine','candidates/8zz-strategy-latest.checks.json','docs/dashboard-data.json','docs/dashboard-data.js','docs/preview.html','docs/snapshots/'+version+'.json','docs/data-version.json'):
              hc.publish_text(remote,path,Path(path).read_text())
          print(json.dumps({'events':summary['pine']['total_events'],'recovered_inputs':summary['current_session']['recovered_zero_generation_inputs'],'new_input_failures':summary['current_session']['status_counts']['input_failure'],'ai_requests':0,'actor_starts':0}))
          PY
      - name: Offline regression and deterministic original Pine
        run: |
          python -m unittest discover -s scripts -p 'test*.py'
          cp 8zz-indicator.pine /tmp/root-pine-before
          python scripts/social_pipeline.py
          cmp /tmp/root-pine-before 8zz-indicator.pine
