name: Authorized one Threads minimal evaluation
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/threads-minimal-once.yml]
permissions:
  contents: write
concurrency:
  group: threads-minimal-once-20261107
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: One authorized Threads generation, no retry
        env:
          CHATANYWHERE_API_KEY: ${{ secrets.CHATANYWHERE_API_KEY }}
          AI_PROVIDER: chatanywhere
          CHATANYWHERE_BASE_URL: https://api.chatanywhere.tech/v1
          CHATANYWHERE_MODEL: gpt-5-mini
          CHATANYWHERE_REASONING_EFFORT: minimal
          AUTHORIZED_SMOKE_SCOPE: 2026-11-07-threads-minimal-once-v1
        run: python scripts/authorized_threads_minimal.py
      - name: Persist sanitized evidence without AI key
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/persist_threads_minimal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: threads-minimal-sanitized-evidence
          path: data/social_chatanywhere_minimal_20261107.json
          retention-days: 7
          if-no-files-found: ignore
