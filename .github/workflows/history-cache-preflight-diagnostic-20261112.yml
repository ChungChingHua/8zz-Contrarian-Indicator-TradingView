name: Diagnose cached-media Actor preflight 20261112
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/history-cache-preflight-diagnostic-20261112.yml]
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: One metadata GET, no Actor start or AI request
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os,re,urllib.request,urllib.error
          from decimal import Decimal
          from datetime import datetime,timezone
          import apify_cost_test as t
          import history_worker as h
          key=os.environ.pop('APIFY_TOKEN','');token=os.environ.pop('GH_TOKEN','')
          result={'actor':'apify~facebook-posts-scraper','key_present':bool(key),'requests':0,'actor_starts':0,'ai_requests':0,'at':h.now()}
          if key:
              req=urllib.request.Request('https://api.apify.com/v2/acts/apify~facebook-posts-scraper',headers={'Authorization':'Bearer '+key,'Accept':'application/json'})
              result['requests']=1
              try:
                  try:response=urllib.request.build_opener(h.StopRedirect()).open(req,timeout=45)
                  except urllib.error.HTTPError as exc:response=exc
                  with response:
                      result['http_status']=response.code
                      mime=response.headers.get('Content-Type','').split(';')[0].strip().lower()
                      result['content_type']=mime if mime in ('application/json','text/html','text/plain') else 'other'
                      body=response.read(4000001)
                      if len(body)>4000000 or key.encode() in body:raise ValueError('response_not_safe_to_retain')
                      value=json.loads(body,parse_float=Decimal)
                  if result['http_status']==200:
                      actor=value['data']
                      result['pricing_record_count']=len(actor.get('pricingInfos',[]))
                      try:result['pricing']=t.plain(t.pricing(actor,datetime.now(timezone.utc)));result['preflight']='passed'
                      except t.Failure as exc:result['preflight']='pricing_rejected';result['safe_code']=exc.code
                  else:
                      error=value.get('error') or {}
                      code=error.get('type') or error.get('code')
                      result['safe_code']=code if isinstance(code,str) and re.fullmatch('[a-zA-Z0-9_-]{1,80}',code) else None
                      msg=str(error.get('message','')).lower()
                      result['fixed_error_markers']=[x for x in ('invalid token','token is not valid','insufficient permission','rate limit','expired','not found','exceeded') if x in msg]
              except Exception as exc:result['error_type']=type(exc).__name__
          t.Docs(token).save('data/history_media_repairs/preflight-diagnostic-20261112.json',result)
          print(json.dumps(result))
          PY
