name: Continue latest history once 20261115
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/history-continue-20261115.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  continue:
    if: ${{ github.ref == 'refs/heads/codex/social-pipeline-20261106' && github.run_attempt == 1 && github.event.head_commit.message == 'Continue remaining history and only new source windows 20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      AUTHORIZED_LATEST_HISTORY: latest-history-20261115
      AUTHORIZED_HISTORY_SCOPE: history-completion-20261107
      AUTHORIZED_RESUME_ID: 20261115-media-repair-01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline tests before acquisition or generation
        run: python -m unittest discover -s scripts -p 'test*.py'
      - name: Restore captured unsent media without another scrape
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: history-latest-classified-cache-20261114
          run-id: 43585240072
          github-token: ${{ github.token }}
          path: /tmp/8zz-history-media-cache
      - name: Verify and retain only unsent cache
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from history_cached_completion import prepare_restored_cache
          print(json.dumps(prepare_restored_cache()))
          PY
      - name: Acquire only new source windows with overlap and durable reservations
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_continue_20261115.py acquire
      - name: Add newly captured image bytes to verified retained cache
        run: python scripts/history_continue_20261115.py cache
      - name: Continue never-dispatched posts only; no paid model fallback
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CHATANYWHERE_API_KEY: ${{ secrets.CHATANYWHERE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_continue_20261115.py classify
      - name: Read final costs of known runs only; no new Actor
        if: always()
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import os,json
          from decimal import Decimal
          import apify_cost_test as t
          import history_completion as hc
          import history_continue_20261115 as continuation
          continuation.configure()
          from history_latest_classify_20261114 import Client
          client=Client(os.environ.pop('APIFY_TOKEN'));docs=t.Docs(os.environ.pop('GH_TOKEN'))
          state=docs.load('data/history_latest_acquisition_20261115.json') or {}
          out={'observed_at':hc.h.now(),'runs':[],'new_starts_by_cost_refresh':0,'actual_AI_points_deducted':None,
              'billing_finality':'API observations, not independently settled invoice. Zero does not establish free execution.',
              'account_remaining_allowance':None,'account_allowance_note':'Scoped /users/me/limits previously denied; no repeated denied query.'}
          for r in state.get('runs',[]):
              if not r.get('run_id'):continue
              row={'source':r['source'],'run_id':r['run_id']}
              try:
                  run=client.request('/actor-runs/'+r['run_id'])['data']
                  row.update({k:t.plain(run.get(k)) for k in ('status','actId','buildId','buildNumber','startedAt','finishedAt','usageTotalUsd','externalChargedTotalUsd','chargedEventCounts')})
              except Exception as exc:row.update(error_type=type(exc).__name__,http_status=getattr(exc,'status',None))
              out['runs'].append(row)
          values=[r.get('usageTotalUsd') for r in out['runs']]
          out['observed_run_total_usd']=str(sum((Decimal(str(v)) for v in values),Decimal(0))) if values and all(v is not None for v in values) else None
          out['http_requests']=client.counts
          docs.save('data/history_latest_costs_20261115.json',out)
          print(json.dumps(t.plain(out)))
          PY
      - name: Preserve verified cache without signed URL queries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-latest-classified-cache-20261115
          path: /tmp/8zz-history-media-cache/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save complete paired Pine retaining quality threshold
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/history_completion.py publish-report
      - name: Final offline regression
        if: always()
        run: python -m unittest discover -s scripts -p 'test*.py'
