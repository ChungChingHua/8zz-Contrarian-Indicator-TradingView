name: Refresh saved history outputs offline only
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/history-refresh-offline-20261110.yml]
permissions:
  contents: write
concurrency:
  group: original-author-history-batch-01
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/social-pipeline-20261106
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild saved snapshots with all non-GitHub networking blocked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json,os
          from pathlib import Path
          from unittest.mock import patch
          import build_audited_dashboard as dashboard
          import history_completion as hc
          token=os.environ.pop('GH_TOKEN')
          protected=['data/usage.json','data/history_completion_control.json','data/live_control.json','data/telegram_outbox.json','data/event_baseline_keys.json']
          before={p:Path(p).read_bytes() if Path(p).exists() else None for p in protected}
          with patch('urllib.request.urlopen',side_effect=AssertionError('offline_no_network')), patch('urllib.request.OpenerDirector.open',side_effect=AssertionError('offline_no_network')):
              result=dashboard.build(refresh_market=False)
          assert len(result['events'])==294
          assert before=={p:Path(p).read_bytes() if Path(p).exists() else None for p in protected}
          remote=hc.Remote(token)
          remote.save('data/signal_events.json',json.loads(Path('data/signal_events.json').read_text()))
          for path in ('docs/dashboard-data.json','docs/dashboard-data.js','docs/preview.html'):
              hc.publish_text(remote,path,Path(path).read_text())
          print(json.dumps({'events':len(result['events']),'ai_requests':0,'actor_starts':0,'market_fetches':0,'notification_requests':0,'protected_state_unchanged':True}))
          PY
      - name: Offline regression suite
        run: python -m unittest discover -s scripts -p 'test*.py'
