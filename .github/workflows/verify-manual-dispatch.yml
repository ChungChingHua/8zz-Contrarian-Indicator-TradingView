name: Verify existing manual dispatch entry once
on:
  push:
    branches: [codex/social-pipeline-20261106]
    paths: [.github/workflows/verify-manual-dispatch.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-consumed-batch:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Dispatch fixed PR ref, no provider credential
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZED_DISPATCH_CHECK: original-author-20261107-01
        run: python scripts/verify_manual_dispatch.py
